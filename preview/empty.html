<!DOCTYPE html>
<html lang="zh-CN">
<head>

</head>
<body>

<div class="frame" style="min-height:640px">
  <div class="statusbar">
    <span class="time">9:41</span>
    <span class="status-right">
      <i class="bars"><b></b><b></b><b></b><b></b></i>
      <span>5G</span>
      <i class="battery"></i>
    </span>
  </div>
  <div class="navbar">
    <span class="back">‹</span>
    我的报名

  <div class="empty-card">

      <div class="empty-ticket"><i></i><i class="short"></i></div>
